---
# Git
- name: Install git
  community.general.pacman:
    name:
      - git
      - lazygit
    state: present
  become: true
  tags: dev-tools

# Lazyvim
- name: Install Neovim
  community.general.pacman:
    name: nvim
    state: present
  become: yes
  tags: dev-tools

- name: Clone RoboVim dotfiles
  ansible.builtin.git:
    repo: https://github.com/ironlegit/nvim-config
    dest: "{{ ansible_facts['user_dir'] }}/.config/nvim"
    depth: 1
  tags: dev-tools
  register: lazyvim_clone


- name: Install Python3, pip, and Poetry globally
  community.general.pacman:
    name:
      - python  # Provides python3 on Arch
      - python-pip
      - poetry  # Installs Poetry system-wide
    state: present
    update_cache: true
  become: true
  tags: dev-tools
