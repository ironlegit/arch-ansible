---
- name: Install base-devel for AUR builds
  community.general.pacman:
    name:
      - base-devel
      - git
    state: present
  become: yes
  tags: aur

- name: Clone paru AUR helper repository
  ansible.builtin.git:
    repo: https://aur.archlinux.org/paru.git
    dest: /tmp/paru
    depth: 1
  tags: aur

- name: Build and install paru
  ansible.builtin.shell: |
    cd /tmp/paru
    makepkg -si --noconfirm
  tags: aur

- name: Install AUR packages with paru
  ansible.builtin.shell: |
    paru -S --noconfirm {{ item }}
  loop: "{{ aur_packages }}"
  tags: aur
