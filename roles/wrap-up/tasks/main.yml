---
- name: Ask whether to reboot
  ansible.builtin.pause:
    prompt: "Reboot this host now? Press Enter to continue, or Ctrl+C to abort."
  register: reboot_prompt

- name: Schedule a reboot after the playbook exits
  ansible.builtin.command: shutdown -r +1 "Reboot requested by Ansible"
  become: true
  when: reboot_prompt.user_input | default('') | lower in ['y', 'yes', '']
