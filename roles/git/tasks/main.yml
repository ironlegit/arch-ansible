---
# Git
tasks:
- name: Install git
    community.general.pacman:
    name: git, lazygit
    state: present

# Lazyvim
- name: Install Neovim
  community.general.pacman:
    name: nvim
    state: present
  become: yes
  tags: lazyvim

- name: Clone RoboVim dotfiles
  ansible.builtin.git:
    repo: https://github.com/ironlegit/nvim-config
    dest: "{{ ansible_facts['user_dir'] }}/.config/nvim"
    depth: 1
  tags: lazyvim
  register: lazyvim_clone

