---
- name: Install zsh and starship
  community.general.pacman:
    name:
      - zsh
      - starship
      - nerd-fonts
    state: present
  become: yes
  tags: zsh

- name: Create starship config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
  tags: zsh

- name: Copy starship configuration
  ansible.builtin.template:
    src: starship.toml.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/starship.toml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: '0644'
  tags: zsh

- name: Add starship to .zshrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.zshrc"
    line: "eval \"$(starship init zsh)\""
    create: yes
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
  tags: zsh

- name: Set zsh as default shell
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh
  become: yes
  tags: zsh
