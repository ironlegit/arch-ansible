---
- name: Install zsh and dependencies
  community.general.pacman:
    name:
      - zsh
      - nerd-fonts
    state: present
  become: yes
  tags: zsh

- name: Install starship via curl
  ansible.builtin.shell: |
    curl -sS https://starship.rs/install.sh | sh -s -- --yes
  args:
    creates: /usr/local/bin/starship
  become: yes
  tags: zsh

- name: Create starship config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/starship"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: '0755'
  tags: zsh

- name: Copy starship configuration
  ansible.builtin.template:
    src: starship.toml.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/starship/starship.toml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: '0644'
  tags: zsh

- name: Add starship to .zshrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/.zshrc"
    block: |
      # Starship prompt
      eval "$(starship init zsh)"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Starship"
    create: yes
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: '0644'
  tags: zsh

- name: Set zsh as default shell
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh
  become: yes
  tags: zsh

- name: Deploy Konsole configuration
  ansible.builtin.template:
    src: konsolerc.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/konsolerc"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: '0644'

- name: Deploy Konsole profile
  ansible.builtin.template:
    src: main_zsh.profile.j2
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/konsole/main_zsh.profile"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: '0644'

- name: Append rendered template to .zshrc
  ansible.builtin.shell: |
    cat << 'EOF' >> ~/.zshrc
    {{ lookup('template', 'templates/.zshrc.j2') | indent(4) }}
    EOF
  args:
    executable: /bin/zsh
