---
- name: Install KDE Plasma minimal desktop selection
  community.general.pacman:
    name: "{{ kde_packages }}"
    state: present
  become: yes
  tags: kde

  - name: Enable and start plasma-login-manager
  ansible.builtin.systemd:
    name: plasmalogin.service
    enabled: true
    state: started
  become: true
  tags: kde
